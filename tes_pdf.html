<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengajuan Cuti</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="flex items-center justify-between bg-white px-4 py-3 shadow-sm">
        <div class="flex items-center space-x-2">
            <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0h4">
                </path>
            </svg>
            <span class="text-gray-700 font-medium text-sm">Home</span>
        </div>
        <!-- Submit Leave Button -->
        <button class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium text-sm transition-colors">
            Ajukan Cuti
        </button>
    </header>

    <!-- Main Content -->
    <main class="flex-1 px-4 py-6 space-y-6">

        <!-- Page Title -->
        <div class="text-center">
            <h1 class="text-2xl font-bold text-gray-900 mb-2">Pengajuan Cuti</h1>
        </div>

        <!-- Remaining Leave Info Card -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-gray-600 text-sm font-medium mb-1">Sisa Cuti Anda</p>
                    <p class="text-3xl font-bold text-blue-600">8 hari</p>
                </div>
                <div class="bg-blue-50 p-3 rounded-full">
                    <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z">
                        </path>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Leave Applications Card -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
            <!-- Card Header -->
            <div class="flex items-center mb-4">
                <span class="text-gray-700 font-medium text-base">Nama</span>
            </div>

            <!-- Empty State -->
            <div class="text-center py-8">
                <div class="bg-gray-50 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2 2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4">
                        </path>
                    </svg>
                </div>
                <h3 class="text-lg font-bold text-gray-900 mb-2">Belum ada pengajuan cuti</h3>
                <p class="text-gray-500 text-sm leading-relaxed">Mulai dengan mengajukan cuti baru</p>
            </div>
        </div>
    </main>

</body>

</html>
